
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aayu Study AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 650px;
      margin: 20px auto;
      background: #1e293b;
      padding: 18px;
      border-radius: 16px;
    }
    #chat {
      height: 50vh;
      min-height: 260px;
      overflow-y: auto;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
    }
    .msg {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 12px;
      margin: 10px 0;
      background: #334155;
      border-radius: 10px;
    }
    .user { background: #164e63; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>📚 Aayu Study AI</h1>
    <p>Your personal study assistant</p>
    <div id="chat" aria-live="polite">
      <div class="msg">
        Namaste! Main Aayu Study AI hoon.
        Apna study question poochho!
      </div>
    </div>

    <form id="form">
      <input id="question"
        placeholder="Apna sawaal likho..."
        maxlength="4000" required>
      <button id="send" type="submit">Send</button>
    </form>
    <p id="status"></p>
  </main>

  <script>
    const API_URL = "PASTE_WORKER_URL_HERE";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    function addMessage(label, text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = label + ": " + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || send.disabled) return;

      if (API_URL === "PASTE_WORKER_URL_HERE") {
        status.textContent =
          "AI connection abhi setup nahi hua hai.";
        return;
      }

      addMessage("You", question, "user");
      input.value = "";
      send.disabled = true;
      status.textContent = "AI soch raha hai...";

      const reply = addMessage("Aayu AI", "Please wait...", "ai");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        reply.textContent = "Aayu AI: " + data.answer;
        status.textContent = "Jawab mil gaya!";
      } catch (error) {
        reply.textContent = "Aayu AI: " + error.message;
        status.textContent = "Connection check karo.";
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
